; PHP settings for Moodle. Values in ${...} come from the environment; defaults
; are set with ENV in the Dockerfile.

expose_php = Off
date.timezone = ${PHP_TIMEZONE}
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
; Required >= 5000 by Moodle 5.2 (MDL-71390).
max_input_vars = 5000
file_uploads = On
zend.exception_ignore_args = On
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache (https://docs.moodle.org/en/OPcache). The code tree is baked into the
; image and never changes at runtime, so timestamps are not revalidated.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.use_cwd = 1
opcache.save_comments = 1
opcache.enable_file_override = 0

apc.enabled = 1
apc.shm_size = 64M
