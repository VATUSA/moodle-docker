ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Log the real client when behind an ingress / load balancer.
LogFormat "%{X-Forwarded-For}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" moodle
CustomLog /proc/self/fd/1 moodle
ErrorLog /proc/self/fd/2

# /var/www/html is a symlink to the Moodle web root (public/ on 5.1+).
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    # Moodle router (https://docs.moodle.org/en/Configuring_the_Router).
    FallbackResource /r.php
</Directory>

# Needed for slash arguments (e.g. /pluginfile.php/1/...).
AcceptPathInfo On

# Let Moodle theme its own error pages.
ErrorDocument 404 /error/index.php
ErrorDocument 403 /error/index.php?code=404

# Never serve internal files (MDL-69333) or dotfiles, except .well-known.
RedirectMatch 404 /\.(?!well-known)
RedirectMatch 404 (/vendor/|/node_modules/|composer\.json|/readme|readme\.txt|upgrade\.txt|UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml)

# Liveness endpoint that does not touch PHP or the database.
Alias /healthz /usr/local/share/moodle/healthz
<Location /healthz>
    Require all granted
    ForceType text/plain
</Location>
<Directory /usr/local/share/moodle>
    Require all granted
</Directory>
