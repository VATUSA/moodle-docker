# Local stack for trying the image: MySQL 8.4 + Valkey + Moodle web + cron.
#   docker compose up -d --build
#   open http://localhost:8080  (admin / see MOODLE_ADMIN_PASSWORD)

x-moodle: &moodle
  build: .
  image: vatusa/moodle:local
  environment: &moodle-env
    MOODLE_WWWROOT: http://localhost:8080
    MOODLE_DB_TYPE: mysqli
    MOODLE_DB_HOST: db
    MOODLE_DB_NAME: moodle
    MOODLE_DB_USER: moodle
    MOODLE_DB_PASSWORD: moodle
    MOODLE_REDIS_HOST: valkey
    MOODLE_DEBUG: "false"
  volumes:
    - moodledata:/var/www/moodledata

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine

  # One-shot: installs into an empty DB or applies pending upgrades.
  bootstrap:
    <<: *moodle
    command: ["moodle-bootstrap"]
    healthcheck:
      disable: true
    environment:
      <<: *moodle-env
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: "Admin-1234!"
      MOODLE_ADMIN_EMAIL: admin@example.com
      MOODLE_SITE_FULLNAME: VATUSA Academy (local)
      MOODLE_SITE_SHORTNAME: academy
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *moodle
    ports:
      - "8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped

  cron:
    <<: *moodle
    command: ["moodle-cron"]
    healthcheck:
      disable: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  dbdata:
  moodledata:
